name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip prereleases like v1.2.3-beta.1 for GitHub Release / major tag moves
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Floating major tag for consumers: uses: org/action@v1
      # Force-updates vN to this release commit (standard Actions practice).
      - name: Move major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          major="v${version%%.*}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Pointing $major -> $GITHUB_SHA ($TAG)"
          git tag -f "$major" "$GITHUB_SHA"
          git push origin "refs/tags/$major" --force

          echo "Major tag $major now at $(git rev-parse "$major")"
